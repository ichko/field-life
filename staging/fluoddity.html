<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluoddity Port</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the simulation fills the frame; one instrument panel floats at the right (bottom sheet on phones). */
:root{
  --void:#030506;       /* behind the world */
  --panel:rgba(12,16,18,.88);
  --line:#22303a;
  --ink:#dfe7ea;
  --ink2:#8197a0;
  --accent:#e7a54a;     /* warm amber: the particles' default hue family */
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:12px/1.4 var(--font-data);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;bottom:12px;width:300px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);
  display:flex;flex-direction:column;overflow:hidden}
#panel header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#panel h1{margin:0;font:600 15px/1.2 var(--font-display);letter-spacing:.01em}
#panel h1 span{color:var(--accent)}
#stat{color:var(--ink2);font-variant-numeric:tabular-nums}
#scroll{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h2{margin:0;font:500 10px/1 var(--font-data);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.row{display:grid;grid-template-columns:96px 1fr 58px;gap:6px;align-items:center}
.row label{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=number]{width:100%;background:#0a0e10;color:var(--ink);border:1px solid var(--line);border-radius:3px;
  font:11px var(--font-data);padding:2px 4px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select,button{font:12px var(--font-data);color:var(--ink);background:#0d1316;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.sel{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;color:var(--ink2)}
#preset{width:100%}
.note{color:var(--ink2);line-height:1.5}
.note b{color:var(--ink);font-weight:500}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink)}
#toggle{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none}
body.hidep #panel{display:none}
body.hidep #toggle{display:block}
@media (max-width:640px){
  #panel{top:auto;left:8px;right:8px;width:auto;height:46%;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="c"></canvas>
<div id="err"></div>
<button id="toggle" type="button">controls (H)</button>
<div id="panel">
  <header>
    <h1>Fluoddity <span>port</span></h1>
    <div id="stat">&nbsp;</div>
  </header>
  <div id="scroll">
    <div class="grp">
      <h2>Preset</h2>
      <select id="preset"></select>
      <div class="btns">
        <button id="b-reset" type="button" title="R">reset</button>
        <button id="b-mutate" type="button" title="M">new mutations</button>
        <button id="b-random" type="button" title="Z">random rule</button>
        <button id="b-back" type="button" title="Backspace">back</button>
        <button id="b-pause" type="button" title="Space">pause</button>
      </div>
      <div class="note">Click a particle to make its cohort's brain the new parent. Drag to pan, wheel to zoom, double-click to recentre.</div>
    </div>
    <div class="grp" id="g-phys"><h2>Physics</h2></div>
    <div class="grp" id="g-set"><h2>Setup</h2></div>
    <div class="grp" id="g-look"><h2>Look</h2></div>
  </div>
</div>

uniform vec4 uRule[20];        // base rule: even = frequency, odd = amplitude
uniform float uSeed, uMut;
out vec4 o;
void main(){
  int j = int(gl_FragCoord.x); float cohortF = floor(gl_FragCoord.y);
  vec4 fr[10], am[10];
  for(int i=0;i<10;i++){ fr[i]=uRule[2*i]; am[i]=uRule[2*i+1]; }
  if(fr[0]==vec4(0) && am[5]==vec4(0)){
    // generate_random_centers(rule_seed + floor(cohort))
    float seed = uSeed + cohortF;
    for(int i=0;i<10;i++){
      float fs = 1.0 + 2.0*pow(hash(vec2(seed, float(i*8+0))), 2.0);
      fr[i] = vec4(hash(vec2(seed,float(i*8+0)))*2.0-1.0, hash(vec2(seed,float(i*8+1)))*2.0-1.0,
                   hash(vec2(seed,float(i*8+2)))*2.0-1.0, hash(vec2(seed,float(i*8+3)))*2.0-1.0)*fs;
      am[i] = vec4(hash(vec2(seed,float(i*8+4)))*2.0-1.0, hash(vec2(seed,float(i*8+5)))*2.0-1.0,
                   hash(vec2(seed,float(i*8+6)))*2.0-1.0, hash(vec2(seed,float(i*8+7)))*2.0-1.0);
    }
  }
  // mutate_rule(rule, mutation_scale, rule_seed + floor(cohort))
  float s = hash(fr[4].xy + am[7].yx + fr[1].zw) + (uSeed + cohortF);
  for(int i=0;i<10;i++){
    am[i] += uMut*(-1.0 + 2.0*hash4(-0.5 + vec2(float(-i)+s, float(i))));
    fr[i] *= 1.0 + uMut*0.5*(hash(vec2(s, float(i))) - 0.5);
  }
  int c = j/2;
  vec4 v = vec4(0);
  for(int i=0;i<10;i++) if(i==c) v = (j%2==0) ? fr[i] : am[i];
  o = v;
}`;

// ---- entity update: sense, think, move. One texel per particle: (pos, vel); second target: hue
const FS_UPDATE = HEAD + `
uniform sampler2D uState, uCanvas, uRules;
uniform int uPW, uN, uFrame, uCohorts, uBoundary, uResetMode, uAbsOri;
uniform float uWS, uAxial, uLateral, uGain, uDrag, uStrafeP, uAngle, uGFM, uDist, uHazard, uOriMix, uHueSens;
uniform bool uSym, uByCohort;
layout(location=0) out vec4 oState;
layout(location=1) out vec4 oHue;

float ACTIVE; float SQ;
void pR(inout vec2 p, float a){ p = cos(a)*p + sin(a)*vec2(p.y, -p.x); }
vec2 safenorm(vec2 p){ return length(p)==0.0 ? vec2(0) : normalize(p); }
vec2 get_can(vec2 p){
  vec2 uv = p/2.0 + 0.5;                       // square canvas: half extent = 1
  if(uBoundary==2) uv = fract(uv);
  return texture(uCanvas, uv).rg;
}
vec4 fourier(vec4 fr[10], vec4 am[10], vec4 pos){
  vec4 r = vec4(0);
  for(int i=0;i<10;i++){
    float ph = dot(pos, fr[i]);
    float off = 2.0*float(i)*0.6283 + am[i].w*3.14159;
    r += am[i]*vec4(sin(ph+off), cos(ph+off*0.7), sin(ph*2.0+off*1.3), cos(ph*2.0+off*0.5));
  }
  return r;
}
vec4 resetState(int index, float cohort_val){
  float idx = float(index);
  vec2 pos = 0.019*vec2(hash(vec2(cohort_val)), hash(vec2(cohort_val+idx+2.142)));
  vec2 vel = 0.00005*(vec2(hash(vec2(cohort_val, idx)), hash(vec2(cohort_val, pos.y)))*2.0-1.0);
  float aspect = 1.0;
  if(uResetMode==0){
    float spots = float(uCohorts);
    float spot_rows = ceil(aspect*sqrt(spots));
    vec2 gridcell = vec2(int(cohort_val)%int(spot_rows), int(cohort_val)/int(spot_rows));
    pos += 1.8*(gridcell/spot_rows)*vec2(aspect);
    pos += 1.8*(0.5*(1.0/vec2(spot_rows, spots/spot_rows)-1.0))*vec2(aspect, 1.0/aspect);
  } else if(uResetMode==1){
    pos = vec2(hash(vec2(cohort_val,1.0)), hash(vec2(cohort_val,2.0)))*2.0-1.0;
  } else {
    float ang = cohort_val/float(uCohorts)*2.0*PI;
    pos += vec2(cos(ang), sin(ang))*0.5;
  }
  return vec4(pos, vel);
}
void main(){
  int index = int(gl_FragCoord.y)*uPW + int(gl_FragCoord.x);
  if(index >= uN){ oState = vec4(10000.0, 10000.0, 0.0, 0.0); oHue = vec4(0); return; }
  ACTIVE = 600000.0*uWS; SQ = sqrt(uWS);
  float cohort = float(uCohorts)*float(index)/ACTIVE;
  vec4 e = texelFetch(uState, ivec2(gl_FragCoord.xy), 0);
  vec2 pos = e.xy, vel = e.zw;

  if(uFrame==0 || uHazard > hash(vec2(float(index)/ACTIVE, float(uFrame)))){
    oState = resetState(index, cohort); oHue = vec4(0.5); return;
  }

  int row = min(int(floor(cohort)), uCohorts-1);
  vec4 fr[10], am[10];
  for(int i=0;i<10;i++){ fr[i]=texelFetch(uRules, ivec2(2*i,row), 0); am[i]=texelFetch(uRules, ivec2(2*i+1,row), 0); }

  // ---- sense
  float sample_dist = 1.0/SQ*0.005*uDist;
  vec2 orientation = safenorm(vel);
  float mix_amt = float(min(1, uAbsOri))*uOriMix;
  if(uAbsOri==1) orientation = mix(orientation, vec2(0,1), mix_amt);
  else if(uAbsOri==2) orientation = mix(orientation, -normalize(pos), mix_amt);
  vec2 lo = orientation*sample_dist, ro = orientation*sample_dist;
  pR(lo,  uAngle*PI);
  pR(ro, -uAngle*PI);
  float scaling = SQ*38.855*uGain;
  vec2 L = get_can(pos+lo)*scaling, R = get_can(pos+ro)*scaling;

  // ---- think: local frame, brain, mirrored brain
  vec2 fwd = safenorm(orientation);
  vec2 left = vec2(fwd.y, -fwd.x);
  L = vec2(dot(L,fwd), dot(L,left));
  R = vec2(dot(R,fwd), dot(R,left));
  vec4 base = fourier(fr, am, vec4(L, R));
  vec4 mir  = uSym ? fourier(fr, am, vec4(R*vec2(1,-1), L*vec2(1,-1))) : vec4(0);
  vec2 f = base.xy + mir.xy*vec2(1,-1);
  vec2 s = base.zw + mir.zw*vec2(1,-1);
  vec2 force  = fwd*f.x*uAxial + left*f.y*uLateral;
  vec2 strafe = fwd*s.x*uAxial + left*s.y*uLateral;
  vec2 col = base.xy + mir.xy;
  force  *= 1.0/SQ*uGFM/400.0;
  strafe *= 1.0/SQ*uGFM/20.0;
  float hue = uHueSens*col.x;
  if(uByCohort) hue = hash(vec2(floor(cohort)));

  // ---- move
  vel = vel*uDrag + force;
  pos += vel;
  pos += strafe*uStrafeP;

  if(uBoundary==0){
    if(pos.x < -1.0 || pos.x > 1.0){ vel.x = -vel.x; pos.x = sign(pos.x)*(1.0-abs(1.0-abs(pos.x))); }
    if(pos.y < -1.0 || pos.y > 1.0){ vel.y = -vel.y; pos.y = sign(pos.y)*(1.0-abs(1.0-abs(pos.y))); }
  } else if(uBoundary==1){
    if(pos.x < -1.0 || pos.x > 1.0 || pos.y < -1.0 || pos.y > 1.0){
      oState = resetState(index, cohort); oHue = vec4(0.5); return;
    }
  } else {
    pos = 2.0*(fract(pos/2.0 - 0.5) - 0.5);
  }
  oState = vec4(pos, vel);
  oHue = vec4(hue);
}`;

// ---- trail: blur (5-tap with centre weight K) then fade
const FS_DECAY = HEAD + `
uniform sampler2D uCan; uniform float uPersist, uDiff; uniform int uFrame;
in vec2 vUv; out vec4 o;
void main(){
  if(uFrame==0){ o = vec4(0); return; }
  ivec2 p = ivec2(gl_FragCoord.xy), n = textureSize(uCan, 0);
  vec2 c = texelFetch(uCan, p, 0).rg;
  float d = clamp(uDiff, 0.001, 1.0);
  d = d*d; float K = 4.0/(pow(5.0, d) - 1.0);
  vec2 s = texelFetch(uCan, (p+ivec2(0,1)+n)%n, 0).rg + texelFetch(uCan, (p-ivec2(0,1)+n)%n, 0).rg
         + texelFetch(uCan, (p+ivec2(1,0)+n)%n, 0).rg + texelFetch(uCan, (p-ivec2(1,0)+n)%n, 0).rg;
  vec2 b = (c*K + s)/(4.0 + K);
  o = vec4(b*clamp(uPersist, 0.0, 0.999), 0.0, 0.0);
}`;

// ---- deposit: each particle stamps vel * (1-p) * gaussian^2 over a 1.54-px square, clipped to a disk
const VS_DEPOSIT = HEAD + `
uniform sampler2D uState; uniform int uPW, uN; uniform float uPointPx;
out vec2 vVel;
void main(){
  int i = gl_VertexID;
  if(i >= uN){ gl_Position = vec4(9.0, 9.0, 0.0, 1.0); gl_PointSize = 1.0; return; }
  vec4 s = texelFetch(uState, ivec2(i%uPW, i/uPW), 0);
  vVel = s.zw;
  gl_Position = vec4(s.xy, 0.0, 1.0);
  gl_PointSize = uPointPx;
}`;
const FS_DEPOSIT = HEAD + `
uniform float uPersist; uniform int uFrame; in vec2 vVel; out vec4 o;
void main(){
  vec2 uv = gl_PointCoord;
  if(length(uv-0.5) > 0.5) discard;
  float k = gaussian(uv-0.5, 0.163);
  float p = clamp(uPersist, 0.001, 0.999);
  o = uFrame==0 ? vec4(0) : vec4(vVel*(1.0-p)*k*k, 0.0, 0.0);
}`;

// ---- what you see: each particle a soft dot, hue from its brain, added up
const VS_SPRITE = HEAD + `
uniform sampler2D uState, uHue; uniform int uPW, uN; uniform float uPointPx, uZoom; uniform vec2 uCam;
out float vHue;
void main(){
  int i = gl_VertexID;
  vec4 s = texelFetch(uState, ivec2(i%uPW, i/uPW), 0);
  if(i >= uN || dot(s.zw,s.zw)==0.0){ gl_Position = vec4(9.0, 9.0, 0.0, 1.0); gl_PointSize = 1.0; return; }

const FS_SPRITE = HEAD + `

const FS_ACCUM = HEAD + `
uniform sampler2D uSrc; uniform bool uWater; uniform float uInk, uInvSamples; in vec2 vUv; out vec4 o;
void main(){

const TONE = `
vec3 inv_asinh(vec3 c, float t){ float l = length(c); return l>0.0 ? normalize(c)*sinh(l*t)/t : c; }
vec3 fwd_asinh(vec3 c, float t){ float l = length(c); return l>0.0 ? c*asinh(l*t)/(l*t) : c; }`;
const FS_TONE = HEAD + TONE + `
uniform sampler2D uSrc; uniform float uBright, uSoft; in vec2 vUv; out vec4 o;
void main(){
  vec3 c = texture(uSrc, vUv).rgb*3.0*uBright;
  o = vec4(fwd_asinh(c, uSoft), 1.0);
}`;
const FS_DOWN = HEAD + TONE + `
uniform sampler2D uSrc; uniform vec2 uTexel; uniform bool uThresh; uniform float uThreshold, uSoft; in vec2 vUv; out vec4 o;
void main(){
  vec3 a = texture(uSrc, vUv + uTexel*vec2(-0.5,-0.5)).rgb, b = texture(uSrc, vUv + uTexel*vec2(0.5,-0.5)).rgb,
       c = texture(uSrc, vUv + uTexel*vec2(-0.5,0.5)).rgb,  d = texture(uSrc, vUv + uTexel*vec2(0.5,0.5)).rgb;

  if(uThresh){ float br = max(col.r, max(col.g, col.b)); col *= max(0.0, br-uThreshold)/max(br, 0.0001); }

function compile(vs, fs){
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail("Shader failed to compile:\n" + gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p); if(!gl.getProgramParameter(p, gl.LINK_STATUS)) fail("Program failed to link:\n" + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ""); u[name] = gl.getUniformLocation(p, gl.getActiveUniform(p, i).name); }
  return {p, u};
}
const P = {
  rules: compile(VS_QUAD, FS_RULES), update: compile(VS_QUAD, FS_UPDATE), decay: compile(VS_QUAD, FS_DECAY),
  deposit: compile(VS_DEPOSIT, FS_DEPOSIT), sprite: compile(VS_SPRITE, FS_SPRITE), accum: compile(VS_QUAD, FS_ACCUM),
  tone: compile(VS_QUAD, FS_TONE), down: compile(VS_QUAD, FS_DOWN), up: compile(VS_QUAD, FS_UP),

};

// ---------------------------------------------------------------- GPU resources
function tex(w, h, ifmt, fmt, type, filter, wrap){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  t.w = w; t.h = h; return t;
}
function fbo(...ts){
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(ts.map((_, i) => gl.COLOR_ATTACHMENT0+i));
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail("Framebuffer incomplete.");
  f.w = ts[0].w; f.h = ts[0].h; return f;
}
const rgba32 = (w,h,filter=gl.NEAREST,wrap=gl.CLAMP_TO_EDGE) => tex(w,h,gl.RGBA32F,gl.RGBA,gl.FLOAT,filter,wrap);
const rgba16 = (w,h,filter=gl.LINEAR) => tex(w,h,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,filter,gl.CLAMP_TO_EDGE);

const PW = 1024;
let W = null;   // world: everything sized by world_size
function buildWorld(ws){
  const N = Math.floor(600000*ws), PH = Math.ceil(N/PW);
  const CN = Math.floor(1024*Math.sqrt(ws));            // canvas side, 1:1 aspect
  const st = [0,1].map(() => rgba32(PW, PH)), hue = [0,1].map(() => tex(PW, PH, gl.R32F, gl.RED, gl.FLOAT, gl.NEAREST, gl.CLAMP_TO_EDGE));
  const can = [0,1].map(() => TRAIL_32 ? tex(CN, CN, gl.RG32F, gl.RG, gl.FLOAT, gl.LINEAR, gl.REPEAT)
                                       : tex(CN, CN, gl.RG16F, gl.RG, gl.HALF_FLOAT, gl.LINEAR, gl.REPEAT));
  W = { ws, N, PH, CN, st, hue, can,
        stF: [fbo(st[0], hue[0]), fbo(st[1], hue[1])], canF: [fbo(can[0]), fbo(can[1])], cur: 0, ccur: 0 };
}
const rulesTex = rgba32(20, 144), rulesF = fbo(rulesTex);

let D = null;   // display targets, sized to the screen
function buildDisplay(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cv.clientWidth*dpr); cv.height = Math.round(cv.clientHeight*dpr);
  const S = Math.max(64, Math.min(2048, Math.min(cv.width, cv.height)));
  const sample = rgba16(S, S), acc = rgba16(S, S), tone = rgba16(S, S), copy = rgba16(S, S), comp = rgba16(S, S);
  const mips = [], ups = []; let m = S;
  for(let i=0;i<5;i++){ m = Math.max(1, m>>1); mips.push(rgba16(m, m)); ups.push(rgba16(m, m)); }
  D = { S, sample, acc, tone, copy, comp, mips, ups,
        sampleF: fbo(sample), accF: fbo(acc), toneF: fbo(tone), copyF: fbo(copy), compF: fbo(comp),
        mipF: mips.map(t => fbo(t)), upF: ups.map(t => fbo(t)) };
}

// ---------------------------------------------------------------- passes
function bindTex(unit, t, prog, name){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(prog.u[name], unit); }
function target(f){ gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.viewport(0, 0, f ? f.w : cv.width, f ? f.h : cv.height); }

function bakeRules(){
  const pr = P.rules; gl.useProgram(pr.p);
  gl.uniform4fv(pr.u.uRule, baseRule); gl.uniform1f(pr.u.uSeed, S.rule_seed); gl.uniform1f(pr.u.uMut, S.mutation_scale);
  target(rulesF); gl.viewport(0, 0, 20, Math.max(1, S.num_cohorts)); gl.disable(gl.BLEND);
  gl.drawArrays(gl.TRIANGLES, 0, 3); rulesDirty = false;
}

function physicsStep(){
  if(rulesDirty) bakeRules();
  const w = W, nx = 1 - w.cur;
  // 1. entities read the trail and move
  let pr = P.update; gl.useProgram(pr.p); gl.disable(gl.BLEND);
  bindTex(0, w.st[w.cur], pr, "uState"); bindTex(1, w.can[w.ccur], pr, "uCanvas"); bindTex(2, rulesTex, pr, "uRules");
  const U = pr.u;
  gl.uniform1i(U.uPW, PW); gl.uniform1i(U.uN, w.N); gl.uniform1i(U.uFrame, frame); gl.uniform1i(U.uCohorts, S.num_cohorts);
  gl.uniform1i(U.uBoundary, S.boundary_conditions); gl.uniform1i(U.uResetMode, S.initial_conditions); gl.uniform1i(U.uAbsOri, S.absolute_orientation);
  gl.uniform1f(U.uWS, w.ws); gl.uniform1f(U.uAxial, S.axial_force); gl.uniform1f(U.uLateral, S.lateral_force);
  gl.uniform1f(U.uGain, S.sensor_gain); gl.uniform1f(U.uDrag, S.drag); gl.uniform1f(U.uStrafeP, S.strafe_power);
  gl.uniform1f(U.uAngle, S.sensor_angle); gl.uniform1f(U.uGFM, S.global_force_mult); gl.uniform1f(U.uDist, S.sensor_distance);
  gl.uniform1f(U.uHazard, S.hazard_rate); gl.uniform1f(U.uOriMix, S.orientation_mix); gl.uniform1f(U.uHueSens, S.hue_sensitivity);
  gl.uniform1i(U.uSym, S.disable_symmetry ? 0 : 1); gl.uniform1i(U.uByCohort, S.color_by_cohort ? 1 : 0);
  target(w.stF[nx]); gl.drawArrays(gl.TRIANGLES, 0, 3);
  w.cur = nx;
  // 2. the trail blurs and fades
  const cn = 1 - w.ccur;
  pr = P.decay; gl.useProgram(pr.p);
  bindTex(0, w.can[w.ccur], pr, "uCan"); gl.uniform1f(pr.u.uPersist, S.trail_persistence); gl.uniform1f(pr.u.uDiff, S.trail_diffusion);
  gl.uniform1i(pr.u.uFrame, frame);
  target(w.canF[cn]); gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 3. every particle adds its new velocity
  pr = P.deposit; gl.useProgram(pr.p);
  bindTex(0, w.st[w.cur], pr, "uState"); gl.uniform1i(pr.u.uPW, PW); gl.uniform1i(pr.u.uN, w.N);
  gl.uniform1f(pr.u.uPersist, S.trail_persistence); gl.uniform1i(pr.u.uFrame, frame);
  // particle half-size .0015/sqrt(ws) world units; the canvas spans 2 units in CN pixels
  gl.uniform1f(pr.u.uPointPx, 2*0.0015/Math.sqrt(w.ws) * w.CN/2);
  gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, PW*w.PH);
  gl.disable(gl.BLEND);
  w.ccur = cn;
  frame++;
}

function renderSample(nSamples){
  const w = W;
  let pr = P.sprite; gl.useProgram(pr.p);
  target(D.sampleF); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  bindTex(0, w.st[w.cur], pr, "uState"); bindTex(1, w.hue[w.cur], pr, "uHue");
  gl.uniform1i(pr.u.uPW, PW); gl.uniform1i(pr.u.uN, w.N); gl.uniform1f(pr.u.uZoom, cam.zoom); gl.uniform2f(pr.u.uCam, cam.x, cam.y);
  gl.uniform1i(pr.u.uWater, S.watercolor_mode ? 1 : 0);
  // display sprite half-size is 1.5x the particle size
  gl.uniform1f(pr.u.uPointPx, Math.max(1, 2*1.5*0.0015/Math.sqrt(w.ws) * D.S/2/cam.zoom));
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, PW*w.PH);
  // add this sample, divided by the sample count, into the accumulator
  pr = P.accum; gl.useProgram(pr.p); gl.blendFunc(gl.ONE, gl.ONE);
  bindTex(0, D.sample, pr, "uSrc"); gl.uniform1i(pr.u.uWater, S.watercolor_mode ? 1 : 0);
  gl.uniform1f(pr.u.uInk, S.ink_weight); gl.uniform1f(pr.u.uInvSamples, 1/nSamples);
  target(D.accF); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
}

function present(){
  // tone map
  let pr = P.tone; gl.useProgram(pr.p);
  bindTex(0, D.acc, pr, "uSrc"); gl.uniform1f(pr.u.uBright, look.brightness); gl.uniform1f(pr.u.uSoft, look.tonemap_softness);
  target(D.toneF); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const bloom = look.bloom && !S.watercolor_mode;
  if(bloom){
    pr = P.down; gl.useProgram(pr.p); gl.uniform1f(pr.u.uSoft, look.tonemap_softness); gl.uniform1f(pr.u.uThreshold, look.bloom_threshold);
    bindTex(0, D.tone, pr, "uSrc"); gl.uniform2f(pr.u.uTexel, 1/D.S, 1/D.S); gl.uniform1i(pr.u.uThresh, 0);
    target(D.copyF); gl.drawArrays(gl.TRIANGLES, 0, 3);
    for(let i=0;i<5;i++){
      const src = i===0 ? D.copy : D.mips[i-1];
      bindTex(0, src, pr, "uSrc"); gl.uniform2f(pr.u.uTexel, 1/src.w, 1/src.h); gl.uniform1i(pr.u.uThresh, i===0 ? 1 : 0);
      target(D.mipF[i]); gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // upsample: ups[i-1] = mips[i-1] + tent(ups[i]), with ups[4] = mips[4]
    pr = P.up; gl.useProgram(pr.p); gl.uniform1f(pr.u.uR, look.bloom_radius);
    let src = D.mips[4];
    for(let i=4;i>0;i--){
      bindTex(0, src, pr, "uSrc"); bindTex(1, D.mips[i-1], pr, "uDst"); gl.uniform2f(pr.u.uTexel, 1/src.w, 1/src.h);
      target(D.upF[i-1]); gl.drawArrays(gl.TRIANGLES, 0, 3); src = D.ups[i-1];
    }
  }
  pr = P.comp; gl.useProgram(pr.p);
  bindTex(0, D.tone, pr, "uSrc"); bindTex(1, D.ups[0], pr, "uBloom"); gl.uniform1i(pr.u.uOn, bloom ? 1 : 0);
  gl.uniform1f(pr.u.uIntensity, look.bloom_intensity); gl.uniform1f(pr.u.uSoft, look.tonemap_softness);
  target(D.compF); gl.drawArrays(gl.TRIANGLES, 0, 3);
  // fit the square into the window
  pr = P.blit; gl.useProgram(pr.p);
  target(null); gl.clearColor(0.012,0.02,0.024,1); gl.clear(gl.COLOR_BUFFER_BIT);
  const s = Math.min(cv.width, cv.height), sx = s/cv.width*2, sy = s/cv.height*2;
  gl.uniform4f(pr.u.uRect, -sx/2, -sy/2, sx, sy);
  bindTex(0, D.comp, pr, "uSrc"); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frameTick(){
  target(D.accF); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  const steps = paused ? 0 : look.speed;
  if(steps === 0){ renderSample(1); }
  else if(look.motion_blur){
    const q = look.blur_quality, n = Math.ceil(steps/q);
    for(let i=0;i<steps;i++){ physicsStep(); if(i % q === 0) renderSample(n); }
  } else { for(let i=0;i<steps;i++) physicsStep(); renderSample(1); }
  present();
}

// ---------------------------------------------------------------- picking a particle
function pick(clientX, clientY){
  const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  const nx = ((clientX - r.left) - (r.width - s)/2)/s*2 - 1, ny = 1 - ((clientY - r.top) - (r.height - s)/2)/s*2;
  const wx = nx*cam.zoom + cam.x, wy = ny*cam.zoom + cam.y;
  const w = W, buf = new Float32Array(PW*w.PH*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, w.stF[w.cur]); gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0, 0, PW, w.PH, gl.RGBA, gl.FLOAT, buf);
  let best = -1, bd = 1e9;
  for(let i=0;i<w.N;i++){ const dx = buf[4*i]-wx, dy = buf[4*i+1]-wy, d = dx*dx+dy*dy; if(d < bd){ bd = d; best = i; } }
  if(best < 0) return;
  const cohort = Math.min(S.num_cohorts-1, Math.floor(S.num_cohorts*best/(600000*w.ws)));
  const row = new Float32Array(80);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rulesF); gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0, cohort, 20, 1, gl.RGBA, gl.FLOAT, row);
  baseRule = row; history.push({rule: row.slice(), seed: S.rule_seed}); rulesDirty = true;
  flash(`parent: cohort ${cohort} of ${S.num_cohorts}`);
}

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const ctl = {};
function rowSlider(parent, key, label, lo, hi, step, obj, onChange){
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<label for="s-${key}" title="${label}">${label}</label><input id="s-${key}" type="range" min="${lo}" max="${hi}" step="${step}"><input id="n-${key}" type="number" step="${step}" aria-label="${label} value">`;
  parent.appendChild(d);
  const r = d.children[1], n = d.children[2];
  const set = v => { obj[key] = v; onChange && onChange(); };
  r.addEventListener("input", () => { n.value = +r.value; set(+r.value); });
  n.addEventListener("change", () => { const v = +n.value; if(v < +r.min) r.min = v; if(v > +r.max) r.max = v; r.value = v; set(v); });
  ctl[key] = {r, n, lo, hi, obj};
}
function rowSelect(parent, key, label, options, obj, onChange){
  const d = document.createElement("label"); d.className = "sel";
  d.innerHTML = `<span>${label}</span><select id="x-${key}">${options.map((o,i) => `<option value="${i}">${o}</option>`).join("")}</select>`;
  parent.appendChild(d); const s = d.querySelector("select");
  s.addEventListener("change", () => { obj[key] = +s.value; onChange && onChange(); });
  ctl[key] = {s, obj};
}
function rowCheck(parent, key, label, obj, onChange){
  const d = document.createElement("label"); d.className = "chk";
  d.innerHTML = `<input id="k-${key}" type="checkbox"><span>${label}</span>`;
  parent.appendChild(d); const c = d.querySelector("input");
  c.addEventListener("change", () => { obj[key] = c.checked; onChange && onChange(); });
  ctl[key] = {c, obj};
}
function syncUI(){
  for(const k in ctl){
    const c = ctl[k], v = c.obj[k];
    if(c.r){ c.r.min = Math.min(c.lo, v); c.r.max = Math.max(c.hi, v); c.r.value = v; c.n.value = +(+v).toFixed(4); }
    else if(c.s) c.s.value = String(+v);
    else if(c.c) c.c.checked = !!v;
  }
}

const gP = $("g-phys"), gS = $("g-set"), gL = $("g-look");
for(const [k, label, lo, hi, step] of PHYS)
  rowSlider(gP, k, label, lo, hi, step, S, k === "mutation_scale" ? () => { rulesDirty = true; } : null);
rowSlider(gS, "num_cohorts", "cohorts", 1, 144, 1, S, () => { S.num_cohorts = Math.max(1, Math.min(144, Math.round(S.num_cohorts))); rulesDirty = true; });
rowSelect(gS, "initial_conditions", "start", ["grid", "random", "ring"], S);
rowSelect(gS, "boundary_conditions", "edges", ["bounce", "reset", "wrap"], S);
rowSelect(gS, "absolute_orientation", "orientation", ["velocity", "up (y axis)", "radial"], S);
rowSlider(gS, "orientation_mix", "orient. mix", 0, 1, 0.01, S);
rowCheck(gS, "disable_symmetry", "disable left/right symmetry", S);
rowSlider(gL, "hue_sensitivity", "hue sens.", -2, 2, 0.001, S);
rowCheck(gL, "color_by_cohort", "colour by cohort", S);
rowCheck(gL, "watercolor_mode", "watercolour", S);
rowSlider(gL, "speed", "steps/frame", 1, 30, 1, look);
rowSlider(gL, "brightness", "brightness", 0.2, 10, 0.01, look);
rowCheck(gL, "bloom", "bloom", look);
rowCheck(gL, "motion_blur", "motion blur", look);
rowSelect(gL, "world_size_i", "world size", ["0.1  (60k)", "0.2  (120k)", "0.4  (240k)", "0.7  (420k)", "1.0  (600k)"], look,
  () => { buildWorld([0.1,0.2,0.4,0.7,1.0][look.world_size_i]); frame = 0; });
look.world_size_i = 2;

const sel = $("preset");
for(const g of ["Core", "Advanced"]){
  const og = document.createElement("optgroup"); og.label = g;
  PRESETS.forEach((c, i) => { if(c.group === g){ const o = document.createElement("option"); o.value = i; o.textContent = c.name; og.appendChild(o); } });
  sel.appendChild(og);
}
sel.addEventListener("change", () => loadPreset(PRESETS[+sel.value]));

let flashMsg = "", flashT = 0;
function flash(m){ flashMsg = m; flashT = performance.now(); }
const act = {
  reset(){ frame = 0; },
  mutate(){ S.rule_seed = Math.random(); history.push({rule: baseRule.slice(), seed: S.rule_seed}); rulesDirty = true; flash("new mutations"); },
  random(){ baseRule = new Float32Array(80); S.rule_seed = Math.random(); history.push({rule: baseRule.slice(), seed: S.rule_seed});
            rulesDirty = true; frame = 0; flash("random rule per cohort"); },
  back(){ if(history.length > 1){ history.pop(); const h = history[history.length-1]; baseRule = h.rule.slice(); S.rule_seed = h.seed; rulesDirty = true; flash("previous rule"); } },
  pause(){ paused = !paused; $("b-pause").textContent = paused ? "play" : "pause"; },
};
$("b-reset").onclick = act.reset; $("b-mutate").onclick = act.mutate; $("b-random").onclick = act.random;
$("b-back").onclick = act.back; $("b-pause").onclick = act.pause;
$("toggle").onclick = () => document.body.classList.remove("hidep");
window.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if(k === "r") act.reset(); else if(k === "m") act.mutate(); else if(k === "z") act.random();
  else if(k === "backspace"){ e.preventDefault(); act.back(); } else if(k === " "){ e.preventDefault(); act.pause(); }
  else if(k === "h") document.body.classList.toggle("hidep");
});

// pan / zoom / pick
let drag = null;
cv.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if(!drag) return; const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if(Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
  if(drag.moved){ cam.x = drag.cx - dx/s*2*cam.zoom; cam.y = drag.cy + dy/s*2*cam.zoom; }
});
cv.addEventListener("pointerup", e => { if(drag && !drag.moved) pick(e.clientX, e.clientY); drag = null; });
cv.addEventListener("dblclick", () => { cam.x = 0; cam.y = 0; cam.zoom = 1; });
cv.addEventListener("wheel", e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  const nx = ((e.clientX - r.left) - (r.width - s)/2)/s*2 - 1, ny = 1 - ((e.clientY - r.top) - (r.height - s)/2)/s*2;
  const wx = nx*cam.zoom + cam.x, wy = ny*cam.zoom + cam.y;
  cam.zoom = Math.min(1.5, Math.max(0.03, cam.zoom*Math.exp(e.deltaY*0.0015)));
  cam.x = wx - nx*cam.zoom; cam.y = wy - ny*cam.zoom;
}, {passive:false});
window.addEventListener("resize", () => buildDisplay());

// ---------------------------------------------------------------- go
buildWorld(look.world_size); buildDisplay();
const startName = "_Default";
const startIdx = Math.max(0, PRESETS.findIndex(c => c.name === startName));
sel.value = startIdx; loadPreset(PRESETS[startIdx]);
let last = performance.now(), fps = 0;
function loop(t){
  frameTick();
  fps = fps*0.9 + 0.1*(1000/Math.max(1, t - last)); last = t;
  const msg = performance.now() - flashT < 1800 ? " · " + flashMsg : "";
  $("stat").textContent = `${W.N.toLocaleString()} particles · ${W.CN}² trail · step ${frame} · ${fps.toFixed(0)} fps` + msg
    + (TRAIL_32 ? "" : " · 16-bit trail");
  requestAnimationFrame(loop);
}
window.__fl = { get frame(){ return frame; }, step: n => { for(let i=0;i<n;i++) physicsStep(); }, frameTick, presets: PRESETS,
  load: name => { const i = PRESETS.findIndex(c => c.name === name); sel.value = i; loadPreset(PRESETS[i]); }, look, S, world: ws => { buildWorld(ws); frame = 0; },
  snap: () => { frameTick(); return cv.toDataURL('image/png'); } };
if(!new URLSearchParams(location.search).has("manual")) requestAnimationFrame(loop);
</script>
